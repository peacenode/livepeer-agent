name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          fetch-depth: 0
      - name: Scan Git history for secrets
        run: ./scripts/scan-secrets.sh
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4.1.0
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: sudo apt-get update
      - run: sudo apt-get install -y ripgrep
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check
      - run: ./test.sh
      - run: pnpm build
      - run: pnpm --filter @livepeer/pi-coding-agent exec npm pack --dry-run
      - run: pnpm package:validate
